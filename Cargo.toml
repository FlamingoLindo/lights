[package]
name = "lights"
version = "0.1.0"
edition = "2024"

[dependencies]
palette = { version = "0.7.6", features = ["named"] }
chrono = "0.4.44"
tokio = { version = "1.52.3", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.125"
log = "0.4.22"
toml = "1.1.2"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.13.4", features = ["json"] }
phf = { version = "0.13.1", features = ["macros"] }
